.wide{max-width:1180px}
.cs{grid-template-columns:1.4fr 1fr}
.msg2{display:flex;gap:10px;margin-bottom:12px}
.av2{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 11px 'JetBrains Mono',monospace;color:#04101f;background:var(--cy)}.av2.BE{background:var(--mg)}.av2.QA{background:var(--y)}
.msg2 b{font-size:13px}.msg2 b i{font-style:normal;color:var(--mut);font-weight:400;margin-left:8px;font:11px 'JetBrains Mono',monospace}.msg2 p{font-size:14.5px;margin-top:2px}

.ide{overflow:hidden;background:#0a1020}
.idb{display:flex;align-items:center;gap:2px;padding:6px 8px;background:#0d1530;border-bottom:1px solid var(--line)}

.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.acts .btn{padding:4px 12px;font-size:12px}
.idm{display:grid;grid-template-columns:1.25fr 1fr}

.pane{flex:1;min-height:0;overflow:auto;padding:8px 10px;font:11.5px/1.5 'JetBrains Mono',monospace;text-shadow:none}.pane[hidden]{display:none}
.pane .ok{color:#6ee7a8}.pane .er{color:#ff7a8a}.pane pre{margin:4px 0 8px;white-space:pre-wrap;color:#b9c6ee;font:inherit}.pane .m{color:var(--cy)}
